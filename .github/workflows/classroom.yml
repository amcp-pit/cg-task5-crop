name: GitHub Classroom Workflow

on: [push]

jobs:
  build:
    name: Autograding
    runs-on: gtest
    steps:
      - uses: actions/checkout@v3
      - uses: education/autograding@v1
  memleaks:
    needs: build
    name: Memory leaks
    runs-on: gtest
    steps:
      - uses: actions/checkout@v3
      - run: |
             g++ ./crop.cpp -o crop -pedantic-errors 
      - run: |
             valgrind --leak-check=full --error-exitcode=101 ./crop tests/in1.txt out1.bmp
